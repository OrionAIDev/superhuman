name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch/PR supersedes an in-flight run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 3.11 and 3.14 are verified locally; the middle versions are covered here.
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      # Full history: TC-7 diffs scripts/fleet/core/ against a historical
      # baseline commit, which a default depth-1 checkout does not fetch.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: tests/requirements.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tests/requirements.txt

      # Several tests shell out to scripts/*.sh and drive throwaway git repos.
      # They set their own per-repo user.name/user.email and disable commit
      # signing, so no global git identity is needed here.
      - name: Run test suite
        run: python -m pytest tests/ -q
